{% extends "base.html" %}

{% block title %}Split-Flap Display{% endblock %}
{% block page_title %}Display{% endblock %}

{% block content %}

  <!-- <div class="section-label">
    CAMERA VIEW
  </div>

  <div class="camera-wrapper">
    <iframe id="camera-stream" class="camera-stream" src="https://webcam.itrussell.me/stream" title="Camera stream" allow="autoplay; fullscreen" frameborder="0" allowfullscreen></iframe>
  </div> -->

  <div class="section-label">
    COMPOSE <span class="section-hint">(click a cell, then type)</span>
  </div>

  <div class="preview-wrapper">
    <div class="preview-grid" id="preview-grid"></div>
  </div>

  <div id="color-palette" class="color-palette"></div>

  <div class="controls">
    <button class="btn btn-secondary" onclick="clearBoard()">CLEAR</button>
    <!-- <button class="btn btn-secondary btn-save" onclick="saveBoard()">SAVE</button> -->
     <button class="btn btn-secondary btn-save popup-trigger" data-target="static-item-save-popup">SAVE</button>
    <button class="btn btn-primary" onclick="submitBoard()">SEND TO DISPLAY</button>
  </div>

  <div class="modal-overlay" id="static-item-save-popup" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="main-popup-title">
      <button type="button" class="modal-close" aria-label="Close popup">×</button>
      <h2 id="main-popup-title">Static Item Name</h2>
      <p>Enter a name for this static item</p>
      <input type="text" id="static-item-name" value="FOO">
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary modal-close-btn">Close</button>
        <button type="button" class="btn btn-secondary btn-save" onclick="saveBoard()" style="width: 500px">SAVE</button>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="/static/app.js?v={{ static_version }}"></script>
{% endblock %}
