{% extends "base.html" %}

{% block title %}Playlist{% endblock %}
{% block page_title %}Playlist{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<div class="section-label">Playlist</div>
  <div class="section-card section-card-playlist">
    <div id="playlist" class="playlist-container">
    </div>
    <div>
      <button id="add-item" type="button" class="btn btn-template popup-trigger" data-target="playlist-popup">Add Item</button>
    </div>
  </div>
</div>

<div id="playlist-popup" class="modal-overlay" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="playlist-popup-title">
    <button type="button" class="modal-close" aria-label="Close popup">×</button>

    <div class="selector-container">
      <div class="field">
        Available Apps
      </div>
      <div class="selection">
        <!-- Apps get loaded into here -->
      </div>
    </div>

    <div class="parameter-container">
      <div id="playlist-popup-title" class="parameter-header">Parameters</div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-secondary modal-close-btn">Close</button>
      <button id="popup-create-item" type="button" class="btn btn-primary">Create Item</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
  <script src="/static/playlist.js?v={{ static_version }}"></script>
{% endblock %}
